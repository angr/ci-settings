name: Resolve the angr/binaries ref
description: >-
  Resolve which angr/binaries revision a build should use. When the pull request
  body references an open angr/binaries pull request, that pull request's head is
  used; otherwise master. Pass the result to actions/checkout as its ref.
outputs:
  ref:
    description: The angr/binaries ref to check out.
    value: ${{ steps.resolve.outputs.ref }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        ref=master
        number=$(printf '%s' "$PR_BODY" |
          grep -Eo '(angr/binaries#|github\.com/angr/binaries/pull/)[0-9]+' |
          head -n 1 |
          grep -Eo '[0-9]+$') || true
        if [ -n "$number" ]; then
          state=$(gh api "repos/angr/binaries/pulls/$number" --jq .state) || state=unavailable
          if [ "$state" = open ]; then
            ref="refs/pull/$number/head"
          else
            echo "angr/binaries#$number is $state, so it is not used"
          fi
        fi
        echo "Checking out angr/binaries at $ref"
        echo "ref=$ref" >>"$GITHUB_OUTPUT"
